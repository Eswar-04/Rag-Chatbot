services:
  # ── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: rag-chatbot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # set to Streamlit service URL after deploy
      - key: PYTHON_VERSION
        value: "3.10.12"

  # ── Streamlit Frontend ───────────────────────────────────────
  - type: web
    name: rag-chatbot-ui
    runtime: python
    buildCommand: pip install streamlit requests
    startCommand: streamlit run app_ui.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false          # set to FastAPI backend URL after deploy
      - key: PYTHON_VERSION
        value: "3.10.12"
